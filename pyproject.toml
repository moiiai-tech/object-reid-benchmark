[project]
name = "object-reid"
version = "0.1.0"
description = "Person Re-Identification Benchmark Suite"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "click>=8.1.0",
    "clip",
    "dvc[all]>=3.65.0",
    "einops>=0.8.1",
    "ftfy>=6.3.1",
    "gdown>=5.2.0",
    "hydra-core>=1.3.0",
    "kagglehub>=0.3.13",
    "omegaconf>=2.3.0",
    "opencv-python>=4.12.0.88",
    "pandas>=2.0.0",
    "regex>=2025.11.3",
    "rich>=13.0.0",
    "scipy>=1.16.3",
    "six>=1.17.0",
    "tabulate>=0.9.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.23",
    "torchmetrics>=1.8.2",
    "torchreid>=0.2.5",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.3",
    "yacs>=0.1.8",
]

[project.scripts]
reid = "reid.cli.main:cli"

[project.optional-dependencies]
gpu = [
    "xformers>=0.0.33.post2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.14.10",
]

[tool.uv.sources]
clip = { git = "https://github.com/openai/CLIP.git" }

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reid*", "benchmark*"]
