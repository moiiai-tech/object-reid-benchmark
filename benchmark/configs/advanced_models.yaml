# Advanced Models Benchmark Configuration
# Tests CLIP-ReID variants, DINOv2, SigLIP2
# Usage: python run_benchmark.py --config benchmark/configs/advanced_models.yaml

gpu_id: 0  # Requires 8GB+ VRAM

data:
  root: "reid-data"

datasets:
  - market1501

# NOTE: camera_num, num_classes, view_num auto-detected per dataset
models:
  # CLIP-ReID Baseline (no SIE, standard stride)
  - type: "clipreid"
    name: "ViT-B-16"
    pretrained_path: null
    view_num: 1
    stride_size: [16, 16]
    input_size: [256, 128]
    sie_camera: false
    sie_coe: 1.0

  # CLIP-ReID + SIE + OLP (Best Performance)
  # SIE: Side Information Embedding (camera ID)
  # OLP: Overlapping Local Patches (stride 12x12)
  - type: "clipreid"
    name: "ViT-B-16"
    pretrained_path: null
    view_num: 1
    stride_size: [12, 12]
    input_size: [256, 128]
    sie_camera: true
    sie_coe: 1.0

  # DINOv2 Models (Self-supervised ViT)
  - type: "dinov2"
    name: "dinov2_vitb14"
    pretrained_path: null
    input_size: [256, 256]

  - type: "dinov2"
    name: "dinov2_vitl14"
    pretrained_path: null
    input_size: [256, 256]

  - type: "dinov2"
    name: "dinov2_vitg14"
    pretrained_path: null
    input_size: [256, 256]

  # SigLIP2 Models (Sigmoid Loss CLIP)
  - type: "siglip2"
    name: "google/siglip2-base-patch16-256"
    pretrained_path: null
    input_size: [256, 256]

  - type: "siglip2"
    name: "google/siglip2-base-patch16-384"
    pretrained_path: null
    input_size: [384, 384]

  - type: "siglip2"
    name: "google/siglip2-so400m-patch14-384"  # 400M params, best performance
    pretrained_path: null
    input_size: [384, 384]

  # PE-Spatial (Dense Prediction Model)
  - type: "pespatial"
    name: "PE-Spatial-G14-448"
    input_size: [448, 448]

output:
  results_dir: "results"
  csv_filename: "advanced_models_benchmark.csv"
