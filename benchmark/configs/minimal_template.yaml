# Minimal Configuration Template
# Copy and modify for custom experiments
# Usage: python run_benchmark.py --config benchmark/configs/my_experiment.yaml

gpu_id: 0

data:
  root: "reid-data"

# Check available datasets: reid dataset list
datasets:
  - market1501

# Check available models: reid model list
# Note: dinov3 not yet released (falls back to dinov2)
models:
  - type: "osnet"
    name: "osnet_x1_0"
    pretrained_path: null

  - type: "clip"
    name: "ViT-B/32"

  # Advanced model example (camera_num, num_classes, view_num are auto-detected)
  # - type: "clipreid"
  #   name: "ViT-B-16"
  #   pretrained_path: null
  #   view_num: 1
  #   stride_size: [16, 16]  # or [12, 12] for dense patches
  #   input_size: [256, 128]
  #   sie_camera: false      # true to use camera info
  #   sie_coe: 1.0

output:
  results_dir: "."
  csv_filename: "benchmark_results.csv"
