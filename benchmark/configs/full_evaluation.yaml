# Full Evaluation Configuration
# Cross-domain: TransReID and CLIP-ReID trained on MSMT17, tested on all datasets
# Zero-shot: All other models tested on all datasets
# Expected runtime: 12-24 hours, GPU memory: ~8GB recommended

cross_domain_mode: true
gpu_id: 0

data:
  root: "reid-data"

# Note: G2A removed (533K queries x 1.9M gallery = 3.77 TiB memory)
# Completed datasets: market1501, dukemtmcreid, cuhk03, msmt17, grid, celebreid, pku
# Remaining datasets to evaluate:
datasets:
  - ilids
  - lastid  # Incomplete - only 2/15 models done
  - ilidsvid
  - iustreid

models:
  # Cross-Domain Models (MSMT17 weights, evaluated on all datasets)
  - type: "clipreid"
    name: "ViT-B-16"
    source_domain: "msmt17"
    pretrained_path: null
    stride_size: [16, 16]
    input_size: [256, 128]
    sie_camera: false
    sie_view: false
    sie_coe: 1.0
    view_num: 1

  - type: "clipreid"
    name: "ViT-B-16-dense"
    source_domain: "msmt17"
    pretrained_path: null
    stride_size: [12, 12]  # Dense stride for better accuracy
    input_size: [256, 128]
    sie_camera: false
    sie_view: false
    sie_coe: 1.0
    view_num: 1

  - type: "transreid"
    name: "vit_base_patch16_224_TransReID"
    source_domain: "msmt17"
    pretrained_path: null
    stride_size: [16, 16]
    input_size: [256, 256]
    sie_camera: false
    sie_view: false
    sie_coe: 3.0
    jpm: false
    drop_path: 0.1
    drop_out: 0.0
    att_drop_rate: 0.0

  # CNN Baseline Models (Zero-shot with ImageNet weights)
  - type: "osnet"
    name: "osnet_x1_0"
    pretrained_path: null

  - type: "osnet"
    name: "osnet_x0_75"
    pretrained_path: null

  - type: "osnet"
    name: "osnet_x0_5"
    pretrained_path: null

  # Vision-Language Models (Zero-shot)
  - type: "clip"
    name: "ViT-B/32"

  - type: "clip"
    name: "ViT-B/16"

  - type: "clip"
    name: "ViT-L/14"

  - type: "siglip2"
    name: "google/siglip2-base-patch16-256"
    pretrained_path: null
    input_size: [256, 256]

  - type: "siglip2"
    name: "google/siglip2-base-patch16-384"
    pretrained_path: null
    input_size: [384, 384]

  # Self-Supervised Models (Zero-shot)
  - type: "dinov2"
    name: "dinov2_vitb14"
    pretrained_path: null
    input_size: [256, 256]

  - type: "dinov2"
    name: "dinov2_vitl14"
    pretrained_path: null
    input_size: [256, 256]

  # Large Vision Models (Zero-shot)
  - type: "pecore"
    name: "PE-Core-L14-336"
    input_size: [336, 336]

output:
  results_dir: "results"
  csv_filename: "full_evaluation_results.csv"
